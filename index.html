<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A2540" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" />
<title>Ruteo por Carteras · TR1 · Trentino</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  :root{
    --marino:#0A2540; --marino-2:#123E70; --real:#0066CC; --real-osc:#0052A3;
    --cielo:#EAF2FE; --cielo-b:#CFE0FA;
    --txt:#0A2540; --txt-2:#5A6B82; --txt-3:#8A99AE;
    --borde:#E3EAF3; --fondo:#F2F5FA; --sup:#FFFFFF;
    --ok:#17A34A; --ok-suave:#E7F7EE; --hoy:#E58A00;
    --sh-sm:0 1px 3px rgba(10,37,64,.08);
    --sh:0 1px 2px rgba(10,37,64,.04), 0 10px 28px rgba(10,37,64,.08);
    --r-lg:22px; --r-md:16px;
    color-scheme: light;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background: radial-gradient(900px 380px at 50% -120px, #D6E5FB 0%, rgba(214,229,251,0) 70%), var(--fondo);
    color:var(--txt);
    font-family:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  button{font-family:inherit; cursor:pointer;}
  :focus-visible{outline:3px solid #66A8FF; outline-offset:2px;}
  #app{max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  /* ---------- Header ---------- */
  header.top{
    position:relative; overflow:hidden; color:#fff;
    background:linear-gradient(160deg, var(--marino-2) 0%, var(--marino) 72%);
    padding:calc(14px + env(safe-area-inset-top,0px)) 18px 6px;
    border-radius:0 0 30px 30px; box-shadow:0 12px 30px rgba(10,37,64,.25);
  }
  header.top::before, header.top::after{
    content:""; position:absolute; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(102,168,255,.35), rgba(102,168,255,0) 70%);
  }
  header.top::before{width:260px; height:260px; right:-90px; top:-110px;}
  header.top::after{width:200px; height:200px; left:-80px; bottom:-120px; opacity:.6;}
  .brand-top{position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .credit{font-size:.72rem; line-height:1.35; color:#B9CCE6;}
  .credit strong{display:block; font-weight:700; color:#E3ECF8;}
  .logo-chip{flex:0 0 auto; background:#fff; border-radius:999px; padding:5px 10px; display:flex; box-shadow:0 2px 8px rgba(0,0,0,.18);}
  .logo-chip img{display:block; height:26px; width:auto;}
  .title-row{position:relative; z-index:1; display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin-top:14px;}
  header.top h1{font-size:1.55rem; line-height:1.1; margin:0; font-weight:900; letter-spacing:-.3px;}
  header.top h1 span{display:inline-block; font-size:.8rem; vertical-align:middle; margin-left:6px; padding:3px 9px;
    border-radius:999px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); font-weight:800;}
  .today-badge{font-size:.72rem; font-weight:800; color:#FFE2B0; background:rgba(229,138,0,.18);
    border:1px solid rgba(255,190,90,.35); padding:5px 10px; border-radius:999px; white-space:nowrap;}
  .spv-scroll{position:relative; z-index:1; display:flex; gap:8px; overflow-x:auto; padding:14px 18px 16px; margin:0 -18px; scrollbar-width:none;}
  .spv-scroll::-webkit-scrollbar{display:none;}
  .spv-pill{flex:0 0 auto; display:inline-flex; align-items:center; gap:8px; height:42px; padding:0 14px; border-radius:999px;
    font-size:.88rem; font-weight:800; color:#fff; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2);
    white-space:nowrap; transition:background .18s, color .18s, transform .12s;}
  .spv-pill i{width:9px; height:9px; border-radius:50%; background:var(--dot); box-shadow:0 0 0 2px rgba(255,255,255,.35);}
  .spv-pill small{font-size:.7rem; font-weight:800; opacity:.75; font-variant-numeric:tabular-nums;}
  .spv-pill:active{transform:scale(.96);}
  .spv-pill.active{background:#fff; color:var(--marino); border-color:#fff; box-shadow:0 6px 16px rgba(0,0,0,.25);}

  /* ---------- KPIs ---------- */
  .kpi-strip{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:16px 16px 6px;}
  .kpi{background:var(--sup); border-radius:18px; padding:12px 6px 10px; text-align:center; box-shadow:var(--sh); position:relative; overflow:hidden;}
  .kpi::before{content:""; position:absolute; inset:0 0 auto 0; height:3px; background:var(--k,var(--real));}
  .kpi b{display:block; font-size:1.4rem; line-height:1.05; font-weight:900; color:var(--marino); font-variant-numeric:tabular-nums;}
  .kpi span{display:block; font-size:.7rem; font-weight:700; color:var(--txt-2); margin-top:4px;}
  .kpi em{display:block; font-style:normal; font-size:.66rem; font-weight:800; color:var(--ok); margin-top:2px;}

  /* ---------- Barra fija ---------- */
  .sticky{position:sticky; top:0; z-index:900; padding:10px 0 8px;
    background:rgba(242,245,250,.9); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border-bottom:1px solid transparent; transition:border-color .2s, box-shadow .2s;}
  .sticky.stuck{border-color:var(--borde); box-shadow:0 6px 18px rgba(10,37,64,.08);}
  .row1{display:flex; gap:8px; padding:0 16px;}
  .search-wrap{position:relative; flex:1; min-width:0;}
  .search-wrap svg.ico{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--real); pointer-events:none;}
  .search-wrap input{width:100%; height:48px; padding:0 44px 0 44px; border-radius:var(--r-md); border:2px solid var(--borde);
    background:#fff; font-size:1rem; font-family:inherit; font-weight:700; color:var(--txt); outline:none; box-shadow:var(--sh-sm);
    -webkit-appearance:none; appearance:none; transition:border-color .15s, box-shadow .15s;}
  .search-wrap input::placeholder{color:var(--txt-3); font-weight:600;}
  .search-wrap input:focus{border-color:var(--real); box-shadow:0 0 0 4px rgba(0,102,204,.14);}
  .x-btn{position:absolute; right:8px; top:50%; transform:translateY(-50%); width:32px; height:32px; border-radius:50%;
    border:none; background:var(--cielo); color:var(--real-osc); display:none; align-items:center; justify-content:center; font-weight:900;}
  .x-btn.show{display:flex;}
  .seg{flex:0 0 auto; display:flex; padding:4px; gap:4px; background:var(--cielo); border:1px solid var(--cielo-b); border-radius:var(--r-md);}
  .seg button{width:44px; height:38px; border:none; border-radius:12px; background:transparent; color:var(--real-osc);
    display:flex; align-items:center; justify-content:center; transition:background .15s, color .15s;}
  .seg button.active{background:#fff; color:var(--marino); box-shadow:0 2px 8px rgba(10,37,64,.14);}

  .day-chips{display:flex; gap:6px; margin-top:8px; padding:2px 16px; overflow-x:auto; scrollbar-width:none;}
  .day-chips::-webkit-scrollbar, .rail::-webkit-scrollbar{display:none;}
  .day-chip{flex:0 0 auto; display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 10px 0 12px; border-radius:999px;
    font-size:.86rem; font-weight:800; background:#fff; color:var(--marino); border:1.5px solid var(--cielo-b);
    transition:background .15s, color .15s, border-color .15s, transform .1s;}
  .day-chip small{min-width:26px; padding:2px 6px; border-radius:999px; background:var(--cielo); color:var(--real-osc);
    font-size:.7rem; font-weight:900; text-align:center; font-variant-numeric:tabular-nums;}
  .day-chip:active{transform:scale(.95);}
  .day-chip.zero{opacity:.45;}
  .day-chip.active{background:var(--real); color:#fff; border-color:var(--real); box-shadow:0 4px 12px rgba(0,102,204,.3);}
  .day-chip.active small{background:rgba(255,255,255,.22); color:#fff;}
  .day-chip.today{border-color:#FFC977; color:#9A5B00; background:#FFF6E6; padding:0 12px;}
  .day-chip.today.active{background:var(--hoy); border-color:var(--hoy); color:#fff; box-shadow:0 4px 12px rgba(229,138,0,.35);}
  .day-chip.clear{display:none; border-color:transparent; background:transparent; color:var(--txt-2); padding:0 10px;}
  .day-chip.clear.show{display:inline-flex;}

  .rail-wrap{position:relative; margin-top:8px;}
  .rail-label{display:flex; align-items:center; justify-content:space-between; padding:0 16px 4px; font-size:.68rem;
    font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--txt-3);}
  .rail-label button{border:none; background:none; color:var(--real); font-size:.72rem; font-weight:800; text-transform:none; letter-spacing:0; padding:2px 0;}
  .rail{display:flex; gap:6px; overflow-x:auto; padding:2px 16px 2px; scroll-behavior:smooth; scrollbar-width:none;}
  .rchip{flex:0 0 auto; display:inline-flex; align-items:center; gap:7px; height:38px; padding:0 8px 0 10px; border-radius:12px;
    background:#fff; border:1.5px solid var(--borde); color:var(--txt); font-size:.8rem; font-weight:700; white-space:nowrap;
    transition:background .15s, border-color .15s, color .15s, transform .1s;}
  .rchip i{width:8px; height:8px; border-radius:50%; background:var(--c);}
  .rchip b{font-weight:900; font-size:.74rem; color:var(--txt-2);}
  .rchip small{min-width:24px; padding:1px 6px; border-radius:999px; background:var(--fondo); font-size:.68rem; font-weight:900; text-align:center; font-variant-numeric:tabular-nums;}
  .rchip:active{transform:scale(.95);}
  .rchip.active{background:var(--c); border-color:var(--c); color:#fff; box-shadow:0 4px 12px rgba(10,37,64,.2);}
  .rchip.active b{color:rgba(255,255,255,.85);} .rchip.active i{background:#fff;}
  .rchip.active small{background:rgba(255,255,255,.22); color:#fff;}
  .sticky.map-mode .rail-wrap{display:none;}

  /* ---------- Lista ---------- */
  main{flex:1; padding:12px 16px 28px;}
  .hint{display:flex; align-items:center; gap:8px; font-size:.78rem; font-weight:700; color:var(--txt-2); margin:0 2px 10px;}
  .hint b{color:var(--marino);}
  .cartera{background:var(--sup); border-radius:var(--r-lg); margin-bottom:12px; overflow:hidden; box-shadow:var(--sh);
    border:2px solid transparent; transition:border-color .2s, box-shadow .2s; animation:fadeUp .35s ease both;}
  .cartera.open{border-color:var(--c); box-shadow:0 12px 34px rgba(10,37,64,.14);}
  .head{display:flex; align-items:center; gap:12px; padding:14px 12px 12px 14px; cursor:pointer; user-select:none;}
  .avatar{flex:0 0 auto; width:46px; height:46px; border-radius:15px; display:flex; align-items:center; justify-content:center;
    font-size:1rem; font-weight:900; color:#fff; background:var(--c); box-shadow:0 6px 14px -4px var(--c);}
  .cartera.vacante .avatar{background:#C6D0DD; box-shadow:none; color:#fff;}
  .info{flex:1; min-width:0;}
  .toprow{display:flex; align-items:center; gap:5px; flex-wrap:wrap;}
  .code{font-size:.68rem; font-weight:900; color:var(--real-osc); background:var(--cielo); padding:2px 7px; border-radius:999px;}
  .spvtag{font-size:.66rem; font-weight:800; color:var(--txt-2);}
  .vac{font-size:.62rem; font-weight:900; color:#9A5B00; background:#FFF1D9; padding:2px 7px; border-radius:999px;}
  .mixtag{font-size:.62rem; font-weight:900; color:#6A3FC4; background:#F1EBFD; padding:2px 7px; border-radius:999px;}
  .bt-btns{display:inline-flex; gap:6px;}
  .mini.mixbtn{border-color:#D9C8FA; color:#6A3FC4; background:#F7F2FF;}
  .name{font-size:1rem; font-weight:900; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .zone{font-size:.78rem; font-weight:700; color:var(--txt-2); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .right{flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; gap:6px;}
  .count{text-align:right; line-height:1;}
  .count b{font-size:1.3rem; font-weight:900; color:var(--marino); font-variant-numeric:tabular-nums;}
  .count span{display:block; font-size:.64rem; font-weight:700; color:var(--txt-2); margin-top:2px;}
  .week{display:flex; gap:3px;}
  .wb{display:flex; flex-direction:column; align-items:center; gap:2px;}
  .wb .bt{width:8px; height:18px; background:#EEF2F8; border-radius:3px; display:flex; align-items:flex-end; overflow:hidden;}
  .wb .bt i{display:block; width:100%; border-radius:3px; background:color-mix(in srgb, var(--c) 35%, #fff); transition:height .3s;}
  .wb.on .bt i{background:var(--c);}
  .wb em{font-style:normal; font-size:.55rem; font-weight:900; color:var(--txt-3);}
  .wb.on em{color:var(--c);}
  .chev{flex:0 0 auto; color:var(--txt-3); transition:transform .25s, color .2s;}
  .cartera.open .chev{transform:rotate(90deg); color:var(--c);}
  .prog{height:4px; background:#EEF2F8;}
  .prog i{display:block; height:100%; width:0; background:linear-gradient(90deg, #22C55E, var(--ok)); transition:width .4s ease;}
  .body{display:none;}
  .cartera.open .body{display:block;}
  .inner{animation:slideDown .28s ease both; background:#F8FAFE; border-top:1px solid var(--borde);}
  .btools{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 14px; font-size:.76rem; font-weight:700; color:var(--txt-2);}
  .btools span{display:inline-flex; align-items:center; gap:5px;}
  .mini{white-space:nowrap; display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 12px; border-radius:999px; border:1.5px solid var(--cielo-b);
    background:#fff; color:var(--real-osc); font-size:.76rem; font-weight:800;}
  .mini:active{transform:scale(.96);}
  .client{display:flex; align-items:center; gap:10px; padding:11px 12px 11px 12px; margin:0 8px 6px; background:#fff; border-radius:14px;
    border:1px solid var(--borde); transition:background .2s, opacity .2s;}
  .client.pop{animation:pop .35s ease;}
  .check{flex:0 0 auto; width:34px; height:34px; border-radius:50%; border:2px solid var(--cielo-b); background:#fff; color:transparent;
    display:flex; align-items:center; justify-content:center; padding:0; transition:background .15s, border-color .15s, color .15s;}
  .client.done{background:var(--ok-suave); border-color:#BFE8CF;}
  .client.done .check{background:var(--ok); border-color:var(--ok); color:#fff;}
  .client.done .cname{color:#2F6B45;}
  .cbody{flex:1; min-width:0;}
  .cname{font-size:.94rem; font-weight:800; line-height:1.25;}
  .cname mark, .tag mark{background:#FFE58A; color:inherit; border-radius:3px; padding:0 1px;}
  .meta{display:flex; flex-wrap:wrap; align-items:center; gap:4px; margin-top:6px;}
  .tag{font-size:.68rem; padding:3px 8px; border-radius:999px; font-weight:800;}
  .tag.city{background:var(--cielo); color:var(--real-osc);}
  .tag.cat{background:#fff; color:var(--txt-2); border:1px solid var(--borde);}
  .dd{font-size:.64rem; font-weight:900; color:var(--txt-2); background:#fff; border:1px solid var(--borde); padding:2px 6px; border-radius:999px;}
  .dd.hoy{border-color:#FFC977; color:#9A5B00;}
  .dd.on{background:var(--real); border-color:var(--real); color:#fff;}
  .go{flex:0 0 auto; display:inline-flex; align-items:center; gap:4px; height:40px; padding:0 13px 0 10px; border-radius:999px;
    background:var(--real); color:#fff; font-size:.82rem; font-weight:900; text-decoration:none; box-shadow:0 4px 10px rgba(0,102,204,.3);}
  .go:active{background:var(--real-osc); transform:scale(.96);}
  .nogps{flex:0 0 auto; font-size:.66rem; font-weight:800; color:var(--txt-3); border:1px dashed var(--cielo-b); padding:6px 8px; border-radius:999px;}
  .bnav{display:grid; grid-template-columns:1fr auto 1fr; gap:8px; padding:8px 8px 12px;}
  .navb{height:46px; border-radius:14px; border:1.5px solid var(--borde); background:#fff; color:var(--marino); font-size:.82rem; font-weight:900;
    display:flex; align-items:center; justify-content:center; gap:6px; padding:0 10px; white-space:nowrap; overflow:hidden;}
  .navb.close{background:var(--cielo); border-color:var(--cielo-b); color:var(--real-osc);}
  .navb:disabled{opacity:.4;}
  .navb:not(:disabled):active{transform:scale(.97);}
  .navb span{overflow:hidden; text-overflow:ellipsis;}

  .empty{text-align:center; padding:48px 20px; color:var(--txt-2); font-weight:700;}
  .empty .big{font-size:2.4rem; margin-bottom:6px;}
  .clear-btn{margin-top:14px; background:var(--real); border:none; color:#fff; font-size:.95rem; font-weight:800; padding:0 22px; height:46px; border-radius:999px;}

  /* ---------- Mapa ---------- */
  #mapView{display:none; padding:12px 16px 0;}
  #mapView.show{display:block; animation:fadeUp .3s ease both;}
  #listView.hide{display:none;}
  .map-tools{display:flex; gap:8px;}
  .map-tools select{flex:1; min-width:0; height:48px; padding:0 12px; border-radius:var(--r-md); border:2px solid var(--borde);
    font-family:inherit; font-size:.88rem; font-weight:800; color:var(--txt); background:#fff; box-shadow:var(--sh-sm);}
  .icon-btn{flex:0 0 auto; width:48px; height:48px; border-radius:var(--r-md); border:2px solid var(--borde); background:#fff; color:var(--real);
    display:flex; align-items:center; justify-content:center; box-shadow:var(--sh-sm);}
  .icon-btn:active{transform:scale(.95);}
  .legend{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 8px;}
  .legend span{display:inline-flex; align-items:center; gap:6px; font-size:.72rem; font-weight:800; color:var(--txt-2); background:#fff;
    border:1px solid var(--borde); padding:4px 10px; border-radius:999px;}
  .legend i{width:9px; height:9px; border-radius:50%; background:var(--c);}
  #mapNote{margin:0 0 10px; padding:10px 12px; font-size:.8rem; font-weight:700; color:var(--real-osc); background:var(--cielo); border-radius:14px;}
  #leafletMap{width:100%; height:calc(100vh - 330px); min-height:380px; border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--sh); z-index:1;}
  .leaflet-popup-content-wrapper{border-radius:14px;}
  .leaflet-popup-content{font-family:inherit; font-size:.86rem; line-height:1.45;}
  .leaflet-popup-content b{color:var(--marino);}
  .leaflet-popup-content a.pgo{display:inline-block; margin-top:6px; background:var(--real); color:#fff; text-decoration:none; font-weight:800; padding:5px 12px; border-radius:999px;}

  footer{text-align:center; padding:22px 16px calc(90px + env(safe-area-inset-bottom,0px)); color:var(--txt-3); font-size:.72rem; font-weight:700;}

  .fab{position:fixed; right:16px; bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:950; width:52px; height:52px; border-radius:50%;
    border:none; background:var(--marino); color:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 24px rgba(10,37,64,.35); opacity:0; transform:translateY(16px) scale(.9); pointer-events:none; transition:opacity .2s, transform .2s;}
  .fab.show{opacity:1; transform:none; pointer-events:auto;}
  #toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); z-index:960; transform:translate(-50%, 20px);
    background:var(--marino); color:#fff; font-size:.86rem; font-weight:800; padding:10px 18px; border-radius:999px;
    box-shadow:0 10px 24px rgba(10,37,64,.3); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; white-space:nowrap;}
  #toast.show{opacity:1; transform:translate(-50%,0);}

  @keyframes fadeUp{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
  @keyframes slideDown{from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:none;}}
  @keyframes pop{0%{transform:scale(1);} 40%{transform:scale(1.025);} 100%{transform:scale(1);}}
  @media (max-width:380px){ .kpi b{font-size:1.2rem;} .week{display:none;} }
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important; scroll-behavior:auto !important;} }
</style>
</head>
<body>
<div id="app">
  <header class="top">

    gps:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>'
  };

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const daysOf = cl => String(cl[3]).split(',').map(s => s.trim());
  const hasGps = cl => typeof cl[4] === 'number' && typeof cl[5] === 'number';
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const state = { spv:'TODOS', query:'', days:new Set(), openId:null, vista:'lista' };

  // ---- Hoy y visitas (solo en este teléfono, no toca los datos) ----
  const now = new Date();
  const TODAY_LBL = [null,'Lun','Mar','Mié','Jue','Vie','Sáb'][now.getDay()];
  const todayKey = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  const STORE = 'ruteoTR1_visitas_' + todayKey;
  let visited = new Set();
  try { const raw = localStorage.getItem(STORE); if (raw) visited = new Set(JSON.parse(raw)); } catch(e) {}
  function saveVisited(){ try { localStorage.setItem(STORE, JSON.stringify([...visited])); } catch(e) {} }
  const FECHA_TXT = now.toLocaleDateString('es-PY', {weekday:'long', day:'numeric', month:'short'});
  $('todayBadge').textContent = FECHA_TXT.charAt(0).toUpperCase() + FECHA_TXT.slice(1);

  // ---- Filtros ----
  function matchQuery(cl){ return !state.query || (cl[2] + ' ' + cl[0]).toLowerCase().includes(state.query); }
  function matches(cl){
    if (!matchQuery(cl)) return false;
    if (state.days.size){ const d = daysOf(cl); if (![...state.days].some(x => d.includes(x))) return false; }
    return true;
  }
  const filtering = () => !!(state.query || state.days.size);
  const searching = () => state.query.length >= 2;
  const bySpv = () => state.spv === 'MIXTOS' ? carteras.filter(isMixto) : carteras.filter(c => state.spv === 'TODOS' || c.sup === state.spv);
  function visibleCarteras(){
    return bySpv().map(c => {
      const idx = []; c.cl.forEach((cl,i) => { if (matches(cl)) idx.push(i); });
      return {c, idx};
    }).filter(v => !filtering() || v.idx.length > 0);
  }

  // ---- Toast ----
  let toastT = null;
  function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1600);
  }

  // ---- Supervisores (se construyen una sola vez: no se pierde el desplazamiento) ----
  function buildPills(){
    const wrap = $('spvScroll');
    const sum = arr => arr.reduce((a,c) => a + c.cl.length, 0);
    const items = [{k:'TODOS', p:'Todos', n:sum(carteras), color:'#fff'}, {k:'MIXTOS', p:'⇄ Mixtos', n:sum(carteras.filter(isMixto)), color:'#B18CFF'}]
      .concat(sups.map(s => ({k:s.k, p:s.p, n:sum(carteras.filter(c => c.sup === s.k)), color:supColor[s.k]})));
    wrap.innerHTML = items.map(it =>
      `<button type="button" class="spv-pill" data-k="${esc(it.k)}" style="--dot:${it.color}"><i></i>${esc(it.p)}<small>${it.n.toLocaleString('es-PY')}</small></button>`
    ).join('');
    wrap.querySelectorAll('.spv-pill').forEach(b => b.onclick = () => {
      if (state.spv === b.dataset.k) return;
      state.spv = b.dataset.k; state.openId = null;
      $('vendedorSelect').value = 'TODOS';
      syncPills(); refresh(true);
    });
    syncPills();
  }
  function syncPills(){
    document.querySelectorAll('.spv-pill').forEach(b => {
      const on = b.dataset.k === state.spv; b.classList.toggle('active', on); b.setAttribute('aria-pressed', on);
    });
  }

  // ---- Días (se construyen una vez y solo se actualizan) ----
  function buildDays(){
    const wrap = $('dayChips');
    let h = '';
    if (TODAY_LBL) h += `<button type="button" class="day-chip today" data-today="1">★ Hoy</button>`;
    h += DAY_LABELS.map(d => `<button type="button" class="day-chip" data-d="${d}"><span>${d}</span><small>0</small></button>`).join('');
    h += `<button type="button" class="day-chip clear" id="clearDays">✕ Limpiar</button>`;
    wrap.innerHTML = h;
    wrap.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
      const d = b.dataset.d; state.days.has(d) ? state.days.delete(d) : state.days.add(d); refresh(true);
    });
    const t = wrap.querySelector('[data-today]');
    if (t) t.onclick = () => {
      const only = state.days.size === 1 && state.days.has(TODAY_LBL);
      state.days.clear(); if (!only) state.days.add(TODAY_LBL); refresh(true);
    };
    $('clearDays').onclick = () => { state.days.clear(); refresh(true); };
  }
  function syncDays(){
    const base = bySpv();
    const counts = {}; DAY_LABELS.forEach(d => counts[d] = 0);
    base.forEach(c => c.cl.forEach(cl => { if (!matchQuery(cl)) return; daysOf(cl).forEach(d => { if (d in counts) counts[d]++; }); }));
    document.querySelectorAll('.day-chip[data-d]').forEach(b => {
      const d = b.dataset.d, on = state.days.has(d);
      b.querySelector('small').textContent = counts[d];
      b.classList.toggle('active', on); b.classList.toggle('zero', counts[d] === 0); b.setAttribute('aria-pressed', on);
    });
    const t = document.querySelector('.day-chip.today');
    if (t) t.classList.toggle('active', state.days.size === 1 && state.days.has(TODAY_LBL));
    $('clearDays').classList.toggle('show', state.days.size > 0);
  }

  // ---- KPIs con animación ----
  function setNum(id, to){
    const el = $(id); const from = +el.dataset.v || 0; el.dataset.v = to;
    if (from === to || reduceMotion){ el.textContent = to.toLocaleString('es-PY'); return; }
    const t0 = performance.now(), dur = 450;
    (function step(t){
      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(from + (to - from) * e).toLocaleString('es-PY');
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  }
  function renderKPIs(vis){
    let cli = 0, done = 0; const ciud = new Set();
    vis.forEach(v => v.idx.forEach(i => { const cl = v.c.cl[i]; cli++; ciud.add(cl[0]); if (visited.has(v.c.vc + '|' + i)) done++; }));
    setNum('kCli', cli); setNum('kCar', vis.length); setNum('kCiu', ciud.size); setNum('kVis', done);
    $('kVisPct').textContent = cli ? Math.round(done / cli * 100) + '%' : '0%';
  }

  // ---- Lista de carteras ----
  let current = [];
  const findV = id => current.find(v => v.c.vc === id);
  const isVacante = c => /VACANTE/i.test(c.vn);
  function initials(c){ if (isVacante(c)) return '—'; return c.vn.split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0]).join(''); }
  function shortName(c){
    if (isVacante(c)) return 'Vacante';
    const p = c.vn.split(/\s+/).filter(Boolean);
    return p[0].charAt(0) + p[0].slice(1).toLowerCase() + (p[1] ? ' ' + p[1].charAt(0) + '.' : '');
  }
  function doneCount(v){ return v.idx.filter(i => visited.has(v.c.vc + '|' + i)).length; }

  function cardHtml(v, k){
    const c = v.c, n = v.idx.length;
    const wc = {}; WEEK.forEach(d => wc[d] = 0);
    c.cl.forEach(cl => daysOf(cl).forEach(d => { if (d in wc) wc[d]++; }));
    const max = Math.max(1, ...Object.values(wc));
    const bars = WEEK.map(d => `<span class="wb ${state.days.has(d) ? 'on' : ''}" title="${d}: ${wc[d]} clientes"><span class="bt"><i style="height:${wc[d] ? Math.max(12, Math.round(wc[d] / max * 100)) : 0}%"></i></span><em>${WEEK_LETTER[d]}</em></span>`).join('');
    const pct = n ? doneCount(v) / n * 100 : 0;
    return `<article class="cartera ${isVacante(c) ? 'vacante' : ''}" id="c-${esc(c.vc)}" data-id="${esc(c.vc)}" style="--c:${supColor[c.sup] || '#0066CC'}; animation-delay:${Math.min(k, 12) * 25}ms">
      <div class="head" role="button" tabindex="0" aria-expanded="false">
        <div class="avatar">${esc(initials(c))}</div>
        <div class="info">
          <div class="toprow"><span class="code">${esc(c.vc)}</span><span class="spvtag">${esc(supLabel[c.sup] || c.sup)}</span>${isVacante(c) ? '<span class="vac">Vacante</span>' : ''}${isMixto(c) ? `<span class="mixtag">⇄ Mixto · ${esc((pairOf(c) || {}).vc || '')}</span>` : ''}</div>
          <div class="name">${esc(c.vn)}</div>
          <div class="zone">${esc(c.vz)}</div>
        </div>
        <div class="right">
          <div class="count"><b>${n}</b><span>${filtering() ? 'de ' + c.cl.length : 'clientes'}</span></div>
          <div class="week">${bars}</div>
        </div>
        ${ICON.chev}
      </div>
      <div class="prog"><i style="width:${pct}%"></i></div>
      <div class="body"></div>
    </article>`;
  }

  function hl(s){
    s = String(s); const q = state.query;
    if (!q) return esc(s);
    const i = s.toLowerCase().indexOf(q);
    if (i < 0) return esc(s);
    return esc(s.slice(0,i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length));
  }
  function rowHtml(c, i){
    const cl = c.cl[i];
    const [ciudad, pm, nombre, dias, lat, lon] = cl;
    const key = c.vc + '|' + i, done = visited.has(key);
    const dd = daysOf(cl).map(d => `<span class="dd ${state.days.has(d) ? 'on' : ''} ${d === TODAY_LBL ? 'hoy' : ''}">${esc(d)}</span>`).join('');
    const go = hasGps(cl)
      ? `<a class="go" href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}" target="_blank" rel="noopener" aria-label="Cómo llegar a ${esc(nombre)}">${ICON.pin}<span>Ir</span></a>`
      : `<span class="nogps">Sin GPS</span>`;
    return `<div class="client ${done ? 'done' : ''}" data-k="${esc(key)}">
      <button class="check" type="button" aria-pressed="${done}" aria-label="Marcar como visitado">${ICON.check}</button>
      <div class="cbody"><div class="cname">${hl(nombre)}</div>
        <div class="meta"><span class="tag city">${hl(ciudad)}</span>${pm ? `<span class="tag cat">${esc(pm)}</span>` : ''}${dd}</div>
      </div>${go}</div>`;
  }
  function bodyHtml(v){
    const c = v.c, pos = current.indexOf(v), prev = current[pos - 1], next = current[pos + 1];
    const gps = v.idx.filter(i => hasGps(c.cl[i])).length;
    return `<div class="inner">
      <div class="btools"><span>${ICON.gps} ${gps} de ${v.idx.length} con ubicación</span><span class="bt-btns">${isMixto(c) && pairOf(c) ? `<button class="mini mixbtn" type="button" data-pair="${esc(pairOf(c).vc)}">⇄ ${esc(pairOf(c).vc)}</button>` : ''}<button class="mini" type="button" data-act="map">${ICON.map} Ver zona</button></span></div>
      ${v.idx.map(i => rowHtml(c, i)).join('')}
      <div class="bnav">
        <button class="navb" type="button" data-go="${prev ? esc(prev.c.vc) : ''}" ${prev ? '' : 'disabled'}>‹ <span>${prev ? esc(prev.c.vc) : 'Inicio'}</span></button>
        <button class="navb close" type="button" data-act="close">Cerrar</button>
        <button class="navb" type="button" data-go="${next ? esc(next.c.vc) : ''}" ${next ? '' : 'disabled'}><span>${next ? esc(next.c.vc) : 'Fin'}</span> ›</button>
      </div></div>`;
  }
  function wireBody(el, v){
    el.querySelectorAll('.check').forEach(b => b.onclick = e => {
      e.stopPropagation();
      const row = b.closest('.client'), k = row.dataset.k, on = !visited.has(k);
      on ? visited.add(k) : visited.delete(k); saveVisited();
      row.classList.toggle('done', on); b.setAttribute('aria-pressed', on);
      row.classList.remove('pop'); void row.offsetWidth; row.classList.add('pop');
      el.querySelector('.prog i').style.width = (v.idx.length ? doneCount(v) / v.idx.length * 100 : 0) + '%';
      renderKPIs(current);
      toast(on ? 'Visita registrada ✓' : 'Visita desmarcada');
    });
    el.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { if (b.dataset.go) openCartera(b.dataset.go); });
    el.querySelector('[data-act="close"]').onclick = () => { collapse(v.c.vc); state.openId = null; scrollToCard(v.c.vc); };
    el.querySelector('[data-act="map"]').onclick = () => verZonaDe(v.c.vc);
    const pb = el.querySelector('[data-pair]');
    if (pb) pb.onclick = () => {
      const id = pb.dataset.pair;
      if (findV(id)) openCartera(id);
      else toast(`${id} no tiene clientes con este filtro`);
    };
  }

  function expand(id, scroll){
    const el = $('c-' + id), v = findV(id); if (!el || !v) return;
    el.classList.add('open'); el.querySelector('.head').setAttribute('aria-expanded', 'true');
    el.querySelector('.body').innerHTML = bodyHtml(v); wireBody(el, v);

  function collapse(id){
    const el = $('c-' + id); if (!el) return;
    el.classList.remove('open'); el.querySelector('.head').setAttribute('aria-expanded', 'false');
    el.querySelector('.body').innerHTML = '';
  }
  function openCartera(id){
    if (state.vista !== 'lista') setVista('lista');
    // Una sola cartera abierta a la vez (salvo en búsqueda): la lista queda corta y fácil de recorrer
    if (!searching()) document.querySelectorAll('.cartera.open').forEach(o => { if (o.dataset.id !== id) collapse(o.dataset.id); });
    state.openId = id; expand(id, true); syncRail(id);
  }
  function toggle(id){
    const el = $('c-' + id);
    if (el.classList.contains('open')){ collapse(id); if (state.openId === id) state.openId = null; return; }
    openCartera(id);
  }
  function stickyH(){ return $('stickyBar').offsetHeight; }
  function scrollToCard(id){
    requestAnimationFrame(() => {
      const el = $('c-' + id); if (!el) return;
      const y = el.getBoundingClientRect().top + window.scrollY - stickyH() - 10;
      window.scrollTo({top:y, behavior: reduceMotion ? 'auto' : 'smooth'});
    });
  }

  function renderList(){
    current = visibleCarteras();
    renderKPIs(current);
    const main = $('main');
    if (!current.length){
      main.innerHTML = `<div class="empty"><div class="big">🔍</div>Sin resultados para el filtro aplicado.<br><button class="clear-btn" id="clearBtn" type="button">Limpiar filtros</button></div>`;
      $('clearBtn').onclick = () => { state.query = ''; state.days.clear(); $('searchInput').value = ''; refresh(true); };
      $('rail').innerHTML = '';
      return;
    }
    const n = current.reduce((a,v) => a + v.idx.length, 0);
    const hint = filtering()
      ? `<div class="hint">Mostrando <b>${n.toLocaleString('es-PY')}</b> clientes en <b>${current.length}</b> carteras · tocá una para abrirla</div>`
      : `<div class="hint">Tocá una cartera para ver sus clientes, o saltá con la barra de arriba</div>`;
    main.innerHTML = hint + current.map(cardHtml).join('');
    main.querySelectorAll('.cartera').forEach(el => {
      const h = el.querySelector('.head');
      h.onclick = () => toggle(el.dataset.id);
      h.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(el.dataset.id); } };
    });
    renderRail();
    if (searching()) current.forEach(v => expand(v.c.vc, false));

    else state.openId = null;
  }

  // ---- Barra para saltar entre carteras ----
  let railActive = null;
  function renderRail(){
    const rail = $('rail');
    rail.innerHTML = current.map(v => `<button type="button" class="rchip" id="r-${esc(v.c.vc)}" data-id="${esc(v.c.vc)}" style="--c:${supColor[v.c.sup] || '#0066CC'}"><i></i><b>${esc(v.c.vc)}</b>${isMixto(v.c) ? '⇄ ' : ''}${esc(shortName(v.c))}<small>${v.idx.length}</small></button>`).join('');
    rail.querySelectorAll('.rchip').forEach(b => b.onclick = () => openCartera(b.dataset.id));

  }
  function syncRail(id){
    if (!id || id === railActive) return; railActive = id;

  }
  function spyId(){
    const off = stickyH() + 24; let best = null;

    return best;
  }
  $('collapseAll').onclick = () => { document.querySelectorAll('.cartera.open').forEach(o => collapse(o.dataset.id)); state.openId = null; toast('Carteras cerradas'); };

  // Al cambiar un filtro, la lista vuelve a empezar justo debajo de la barra (sin saltos raros)
  function keepTop(){
    const anchor = state.vista === 'lista' ? $('main') : $('mapView');
    const y = anchor.getBoundingClientRect().top + window.scrollY - stickyH() - 4;
    if (window.scrollY > y) window.scrollTo({top:y});
  }

  // ---- Mapa ----
  let leafletMap = null, markersLayer = null, meMarker = null, lastBounds = [];
  function initMap(){
    if (leafletMap) return;
    const paraguayBounds = L.latLngBounds([-27.7,-63.7], [-19.2,-53.6]);
    leafletMap = L.map('leafletMap', {maxBounds: paraguayBounds.pad(0.15), minZoom:6}).setView([-25.35, -57.25], 9);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom:19, attribution:'&copy; Esri &mdash; Source: Esri, HERE, Garmin, USGS, NGA, EPA, NPS'
    }).addTo(leafletMap);
    markersLayer = L.layerGroup().addTo(leafletMap);
  }
  function renderMap(){
    initMap(); markersLayer.clearLayers();
    const vendedorSel = $('vendedorSelect').value;
    const mixSel = vendedorSel.startsWith('MIX:');
    const base = vendedorSel === 'TODOS' ? bySpv()
      : mixSel ? carteras.filter(c => isMixto(c) && numOf(c.vc) === vendedorSel.slice(4))
      : carteras.filter(c => c.vc === vendedorSel);
    const MIXCOL = ['#0066CC', '#E58A00'];
    const colorDe = c => mixSel ? MIXCOL[base.indexOf(c) % 2] : (supColor[c.sup] || '#0066CC');
    let conUbic = 0, total = 0; lastBounds = [];
    const supsEnMapa = new Set();
    base.forEach(c => {
      c.cl.forEach(cl => {
        if (!matches(cl)) return;
        total++;
        if (!hasGps(cl)) return;
        const [ciudad, pm, nombre, dias, lat, lon] = cl;
        conUbic++; supsEnMapa.add(c.sup);
        const m = L.circleMarker([lat, lon], {
          radius: vendedorSel === 'TODOS' ? 7 : 9, color:'#fff', weight:2, fillColor: colorDe(c), fillOpacity:.92
        });
        m.bindPopup(`<b>${esc(nombre)}</b><br>${esc(ciudad)}<br>Vendedor: ${esc(c.vc)} · ${esc(c.vn)}<br>Días: ${esc(dias)}<br>` +
          `<a class="pgo" href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}" target="_blank" rel="noopener">Cómo llegar</a>`);
        m.addTo(markersLayer); lastBounds.push([lat, lon]);
      });
    });
    $('mapLegend').innerHTML = mixSel
      ? base.map(c => `<span style="--c:${colorDe(c)}"><i></i>${esc(c.vc)} · ${esc(c.vz)}</span>`).join('')
      : sups.filter(s => supsEnMapa.has(s.k)).map(s => `<span style="--c:${supColor[s.k]}"><i></i>${esc(s.p)}</span>`).join('');
    if (lastBounds.length) leafletMap.fitBounds(lastBounds, {padding:[28,28], maxZoom: vendedorSel === 'TODOS' ? 15 : 16});
    const diaTxt = state.days.size ? [...state.days].join(', ') : 'todos los días';
    const quien = vendedorSel === 'TODOS' ? '' : ' · ' + (mixSel ? base.map(c => c.vc).join(' + ') : vendedorSel);
    $('mapNote').textContent = conUbic
      ? `Mostrando ${conUbic} de ${total} clientes con ubicación cargada (${diaTxt}${quien}).`
      : `Ninguno de los ${total} clientes filtrados tiene ubicación cargada todavía (${diaTxt}${quien}).`;
    setTimeout(() => leafletMap.invalidateSize(), 60);
  }
  const vendedorSelect = $('vendedorSelect');
  carteras.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.vc; opt.textContent = `${c.vc} — ${c.vn} (${c.vz})`;
    vendedorSelect.appendChild(opt);
  });
  if (MIX.codes.length){
    const og = document.createElement('optgroup'); og.label = 'Vendedores mixtos (ambas carteras)';
    MIX.codes.forEach(n => {
      const par = carteras.filter(c => isMixto(c) && numOf(c.vc) === n); if (!par.length) return;
      const opt = document.createElement('option'); opt.value = 'MIX:' + n;
      opt.textContent = `⇄ ${par.map(c => c.vc).join(' + ')} — ${par[0].vn}`;
      og.appendChild(opt);
    });
    vendedorSelect.appendChild(og);
  }
  vendedorSelect.addEventListener('change', renderMap);
  $('btnFit').onclick = () => { if (leafletMap && lastBounds.length) leafletMap.fitBounds(lastBounds, {padding:[28,28]}); };
  $('btnLocate').onclick = () => {
    if (!navigator.geolocation){ toast('Ubicación no disponible'); return; }
    toast('Buscando tu ubicación…');
    navigator.geolocation.getCurrentPosition(p => {
      const ll = [p.coords.latitude, p.coords.longitude];
      if (meMarker) meMarker.setLatLng(ll);
      else meMarker = L.circleMarker(ll, {radius:10, color:'#fff', weight:3, fillColor:'#E5484D', fillOpacity:1}).addTo(leafletMap).bindPopup('Estás aquí');
      leafletMap.flyTo(ll, 15);
    }, () => toast('No se pudo obtener tu ubicación'), {enableHighAccuracy:true, timeout:10000});
  };

  // ---- Lista / Mapa ----
  function setVista(v){
    state.vista = v;
    $('btnViewLista').classList.toggle('active', v === 'lista');
    $('btnViewMapa').classList.toggle('active', v === 'mapa');
    $('listView').classList.toggle('hide', v === 'mapa');
    $('mapView').classList.toggle('show', v === 'mapa');
    $('stickyBar').classList.toggle('map-mode', v === 'mapa');
    if (v === 'mapa') renderMap();
    keepTop();
  }
  $('btnViewLista').onclick = () => setVista('lista');
  $('btnViewMapa').onclick = () => setVista('mapa');
  function verZonaDe(vc){ vendedorSelect.value = vc; setVista('mapa'); renderMap(); }

  // ---- Búsqueda ----
  const searchInput = $('searchInput');
  let debT = null;
  searchInput.addEventListener('input', e => {
    clearTimeout(debT);
    const v = e.target.value;
    debT = setTimeout(() => { state.query = v.trim().toLowerCase(); refresh(true); }, 160);
  });
  $('clearSearch').onclick = () => { searchInput.value = ''; state.query = ''; refresh(true); searchInput.focus(); };

  function refresh(resetScroll){
    syncDays();
    $('clearSearch').classList.toggle('show', !!state.query);
    renderList();
    if (state.vista === 'mapa') renderMap();
    if (resetScroll) keepTop();
  }

  // ---- Scroll: botón arriba, sombra de la barra y cartera activa ----
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      $('toTop').classList.toggle('show', window.scrollY > 600);
      const sb = $('stickyBar'); sb.classList.toggle('stuck', sb.getBoundingClientRect().top <= 0 && window.scrollY > 50);
      if (state.vista === 'lista') syncRail(spyId());
    });
  }, {passive:true});
  $('toTop').onclick = () => window.scrollTo({top:0, behavior: reduceMotion ? 'auto' : 'smooth'});

  $('footerNote').textContent = `Datos generados: ${GEN_DATE} · Las visitas marcadas quedan guardadas solo en este teléfono, por día.`;

  buildPills();
  buildDays();
  refresh(false);
})();
</script>
</body>
</html>
