<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0C1A2E" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Ruteo TR1" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" />
<title>Ruteo por Carteras TR1 | Trentino</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="stylesheet" href="styles.css?v=20261031a" />
<style>
#splash{position:fixed;inset:0;z-index:5000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(120% 80% at 50% 0%,#1B3A6B 0%,#0C1A2E 60%);transition:opacity .5s ease,visibility .5s;}
#splash.fuera{opacity:0;visibility:hidden;}
#splash .sp-logo{background:#fff;border-radius:16px;padding:10px 16px;box-shadow:0 18px 40px -12px rgba(0,0,0,.5);animation:spIn .7s cubic-bezier(.2,.8,.2,1) both;}
#splash .sp-logo img{height:34px;display:block;}
#splash svg{width:180px;height:60px;overflow:visible;}
#splash .sp-c{fill:none;stroke:rgba(255,255,255,.18);stroke-width:4;stroke-linecap:round;}
#splash .sp-a{fill:none;stroke:#2E5BFF;stroke-width:4;stroke-linecap:round;stroke-dasharray:240;stroke-dashoffset:240;animation:spRuta 1.6s ease-in-out infinite;}
#splash .sp-p{fill:#0EA371;animation:spLate 1.6s ease-in-out infinite;}
#splash p{margin:0;font:600 .9rem system-ui,sans-serif;color:#A9B7CE;letter-spacing:.02em;}
@keyframes spRuta{0%{stroke-dashoffset:240}60%,100%{stroke-dashoffset:0}}
@keyframes spLate{0%,100%{transform:scale(1);transform-origin:170px 12px}50%{transform:scale(1.5);transform-origin:170px 12px}}
@keyframes spIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="sp-logo"><img src="logo-trentino.png" alt="" /></div>
  <svg viewBox="0 0 180 60"><path class="sp-c" d="M8 50 C 50 50, 50 12, 90 12 S 130 50, 170 12"/><path class="sp-a" d="M8 50 C 50 50, 50 12, 90 12 S 130 50, 170 12"/><circle cx="8" cy="50" r="6" fill="#fff"/><circle class="sp-p" cx="170" cy="12" r="7"/></svg>
  <p>Preparando tu ruta…</p>
</div>
<div id="app">
  <header class="top">
    <div class="brand-top">
      <div class="logo-chip"><img src="logo-trentino.png" alt="Trentino S.A." /></div>
      <div class="top-actions">
        <button type="button" class="cambiar-btn" id="btnCambiar">Cambiar cartera</button>
        <div class="today-badge" id="todayBadge"></div>
      </div>
    </div>
    <div class="title-row">
      <h1 id="tituloApp">Ruteo por carteras <span>TR1</span></h1>
      <p class="credit" id="subtituloApp">Tocá una cartera para ver sus clientes</p>
    </div>
    <div class="spv-scroll" id="spvScroll" aria-label="Supervisores"></div>
  </header>

  <div class="sticky" id="stickyBar">
    <div class="row1">
      <div class="search-wrap">
        <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="Cliente o ciudad" autocomplete="off" aria-label="Buscar cliente o ciudad" enterkeyhint="search" />
        <button class="x-btn" id="clearSearch" type="button" aria-label="Borrar búsqueda">✕</button>
      </div>
      <div class="seg" role="tablist" aria-label="Vista">
        <button id="btnViewLista" class="active" type="button" aria-label="Ver lista"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg></button>
        <button id="btnViewMapa" type="button" aria-label="Ver mapa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg></button>
      </div>
    </div>
    <div class="day-chips" id="dayChips"></div>
  </div>

  <div id="listView"><main id="main"></main></div>

  <div id="mapView">
    <div class="map-tools">
      <select id="vendedorSelect" aria-label="Vendedor"><option value="TODOS">Todos los vendedores</option></select>
      <button class="icon-btn" id="btnFit" type="button" title="Ajustar a los clientes" aria-label="Ajustar a los clientes"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="icon-btn" id="btnLocate" type="button" title="Mi ubicación" aria-label="Mi ubicación"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    </div>
    <div class="legend" id="mapLegend"></div>
    <div id="mapNote"></div>
    <div id="leafletMap"></div>
  </div>

  <!-- Clientes top: visitas por día -->
  <section id="topView" hidden></section>

  <!-- Visitas -->
  <section id="visitasView" hidden></section>

  <!-- Competencia -->
  <section id="compeView" hidden></section>

  <!-- Jefatura: control de supervisores -->
  <section id="jefaturaView" hidden></section>

  <footer id="footerNote"></footer>
</div>
<button class="fab" id="toTop" type="button" aria-label="Volver arriba"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 15 12 9 18 15"/></svg></button>
<div id="toast" role="status" aria-live="polite"></div>
<button type="button" class="btn-volver" id="btnVolver" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg><span>Volver</span></button>

<!-- Barra de navegación inferior -->
<nav class="tabbar" aria-label="Secciones">
  <button type="button" class="tabbar-btn active" data-sec="ruta">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H16a3.5 3.5 0 0 0 0-7H8a3.5 3.5 0 0 1 0-7h7.5"/></svg>
    <span>Ruta</span>
  </button>
  <button type="button" class="tabbar-btn" data-sec="top">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.5L12 17.3l-5.9 3.2 1.3-6.5L2.5 9.4l6.6-.8z"/></svg>
    <span>Top</span>
  </button>
  <button type="button" class="tabbar-btn tab-visitas" data-sec="visitas">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>
    <span>Visitas</span>
  </button>
  <button type="button" class="tabbar-btn tab-compe" data-sec="compe">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 10.5h7M8.5 13.5h4.5"/></svg>
    <span>Competencia</span>
  </button>
  <button type="button" class="tabbar-btn" id="navCatalogo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>
    <span>Catálogo</span>
  </button>
  <button type="button" class="tabbar-btn tab-jefatura" data-sec="jefatura">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    <span>Supervisores</span>
  </button>
</nav>


<!-- Mapa -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<!-- Ruteo de respaldo (la app usa el Excel de ruteo más nuevo de GitHub) -->
<script src="data.js?v=20261031a"></script>
<!-- Clave de supervisores -->
<script src="config.js?v=20261031a"></script>
<!-- Nombres de vendedores (opcional) -->
<script src="vendedores.js?v=20261031a"></script>
<!-- Lector de Excel -->
<script src="excel.js?v=20261031a"></script>
<!-- Reconoce los Excel subidos (ruteo, GPS, padrón, visitas, ventas, precios, potencial) -->
<script src="archivos.js?v=20261031a"></script>
<!-- Ruteo desde el Excel del sistema -->
<script src="ruteo.js?v=20261031a"></script>
<!-- Catálogo de productos -->
<script src="catalogo.js?v=20261031a"></script>
<!-- Visitas -->
<script src="visitas.js?v=20261031a"></script>
<!-- Lista de precios de cada cliente (botón LP) -->
<script src="precios.js?v=20261031a"></script>
<!-- Potencial de cada cliente (se ve en Ruta) -->
<script src="potencial.js?v=20261031a"></script>
<!-- Jefatura: control de supervisores -->
<script src="jefatura.js?v=20261031a"></script>
<!-- Stock (reporte PDF o Excel) -->
<script src="stock.js?v=20261031a"></script>
<!-- Fotos de clientes top y competencia (Google Drive) -->
<script src="fotos.js?v=20261031a"></script>
<!-- Avisos (campanita) -->
<script src="avisos.js?v=20261031a"></script>
<!-- Lógica de la aplicación -->
<script src="app.js?v=20261031a"></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
