<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0C1A2E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" />
<title>Ruteo por Carteras TR1 | Trentino</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<link rel="stylesheet" href="styles.css?v=20261021d" />
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand-top">
      <div class="logo-chip"><img src="logo-trentino.png" alt="Trentino S.A." /></div>
      <div class="top-actions">
        <button type="button" class="cambiar-btn" id="btnCambiar">Cambiar cartera</button>
        <div class="today-badge" id="todayBadge"></div>
      </div>
    </div>
    <div class="title-row">
      <h1 id="tituloApp">Ruteo por carteras <span>TR1</span></h1>
      <p class="credit" id="subtituloApp">Tocá una cartera para ver sus clientes</p>
    </div>
    <div class="spv-scroll" id="spvScroll" aria-label="Supervisores"></div>
  </header>

  <div class="sticky" id="stickyBar">
    <div class="row1">
      <div class="search-wrap">
        <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="Cliente o ciudad" autocomplete="off" aria-label="Buscar cliente o ciudad" enterkeyhint="search" />
        <button class="x-btn" id="clearSearch" type="button" aria-label="Borrar búsqueda">✕</button>
      </div>
      <div class="seg" role="tablist" aria-label="Vista">
        <button id="btnViewLista" class="active" type="button" aria-label="Ver lista"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg></button>
        <button id="btnViewMapa" type="button" aria-label="Ver mapa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg></button>
      </div>
    </div>
    <div class="day-chips" id="dayChips"></div>
  </div>

  <div id="listView"><main id="main"></main></div>

  <div id="mapView">
    <div class="map-tools">
      <select id="vendedorSelect" aria-label="Vendedor"><option value="TODOS">Todos los vendedores</option></select>
      <button class="icon-btn" id="btnFit" type="button" title="Ajustar a los clientes" aria-label="Ajustar a los clientes"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="icon-btn" id="btnLocate" type="button" title="Mi ubicación" aria-label="Mi ubicación"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    </div>
    <div class="legend" id="mapLegend"></div>
    <div id="mapNote"></div>
    <div id="leafletMap"></div>
  </div>

  <!-- Clientes top: visitas por día -->
  <section id="topView" hidden></section>

  <!-- Visitas (supervisores) -->
  <section id="visitasView" hidden></section>

  <!-- Lista de precios -->
  <section id="preciosView" hidden></section>

  <footer id="footerNote"></footer>
</div>
<button class="fab" id="toTop" type="button" aria-label="Volver arriba"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 15 12 9 18 15"/></svg></button>
<div id="toast" role="status" aria-live="polite"></div>

<!-- Barra de navegación inferior -->
<nav class="tabbar" aria-label="Secciones">
  <button type="button" class="tabbar-btn active" data-sec="ruta">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H16a3.5 3.5 0 0 0 0-7H8a3.5 3.5 0 0 1 0-7h7.5"/></svg>
    <span>Ruta</span>
  </button>
  <button type="button" class="tabbar-btn" data-sec="top">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.5L12 17.3l-5.9 3.2 1.3-6.5L2.5 9.4l6.6-.8z"/></svg>
    <span>Top</span>
  </button>
  <button type="button" class="tabbar-btn tab-visitas" data-sec="visitas">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>
    <span>Visitas</span>
  </button>
  <button type="button" class="tabbar-btn" id="navCatalogo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>
    <span>Catálogo</span>
  </button>
  <button type="button" class="tabbar-btn" data-sec="precios">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1.6"/></svg>
    <span>Precios</span>
  </button>
</nav>


<!-- Datos -->
<script src="data.js?v=20261021d"></script>
<script src="data-mix.js?v=20261021d"></script>
<!-- Clave de supervisores -->
<script src="config.js?v=20261021d"></script>
<!-- Nombres de vendedores (editar aquí) -->
<script src="vendedores.js?v=20261021d"></script>
<!-- Lector de Excel (clientes top y precios) -->
<script src="excel.js?v=20261021d"></script>
<!-- Buscador de archivos subidos (visitas y precios con cualquier nombre) -->
<script src="archivos.js?v=20261021d"></script>
<!-- Catálogo de productos -->
<script src="catalogo.js?v=20261021d"></script>
<!-- Visitas (supervisores) -->
<script src="visitas.js?v=20261021d"></script>
<!-- Lista de precios -->
<script src="precios.js?v=20261021d"></script>
<!-- Lógica de la aplicación -->
<script src="app.js?v=20261021d"></script>
</body>
</html>
